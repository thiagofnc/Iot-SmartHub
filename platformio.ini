; Top-level PlatformIO project for the whole SmartHub repo.
;
; Open this repo folder in VS Code:
;   C:\IoT-SmartHub\Iot-SmartHub
;
; Then use PlatformIO's Project Tasks:
;   screen > General > Upload
;   camera > General > Upload

[platformio]
default_envs = screen
src_dir = .

[env:screen]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
build_src_filter =
  -<*>
  +<Screen Code/Screen-pIO/src/**>
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -I "Screen Code/Screen-pIO/include"
lib_deps =
  lvgl/lvgl@8.3.11
  lovyan03/LovyanGFX@1.2.0
  bblanchon/ArduinoJson@7.4.2
  bodmer/TJpg_Decoder@1.1.0

[env:camera]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_src_filter =
  -<*>
  +<Camera Code/Camera-pIO/src/**>
build_flags =
  -D BOARD_HAS_PSRAM
  -D CAMERA_MODEL_XIAO_ESP32S3
  -I "Camera Code/Camera-pIO/include"
`