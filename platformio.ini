; Top-level PlatformIO project for the whole SmartHub repo.
;
; Open this repo folder in VS Code:
;   C:\IoT-SmartHub\Iot-SmartHub
;
; Then use PlatformIO's Project Tasks:
;   screen > General > Upload
;   main > General > Upload
;   camera > General > Upload

[platformio]
default_envs = screen
src_dir = .

[env:screen]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
build_src_filter =
  -<*>
  +<Screen Code/Screen-pIO/src/**>
; DIAGNOSTIC: ARDUINO_USB_CDC_ON_BOOT temporarily removed. With it removed,
; Serial maps back to UART0 (GPIO43/44 via the CP2102) so the USB-C COM port
; shows app output. Re-add once the boot-loop cause is identified.
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -I "Screen Code/Screen-pIO/include"
lib_deps =
  lvgl/lvgl@8.3.11
  lovyan03/LovyanGFX@1.2.0
  bblanchon/ArduinoJson@7.4.2
  bodmer/TJpg_Decoder@1.1.0

[env:main]
platform = espressif32@6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<Main Code/Main-pIO/src/receiver/**>
  +<Main Code/Main-pIO/src/web/**>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D HELTEC_BOARD=30
  -D SLOW_CLK_TPYE=0
  -D LoRaWAN_DEBUG_LEVEL=0
  -D WIFI_LORA_32_V3=1
  -D RADIO_CHIP_SX1262=1
  -D ACTIVE_REGION=LORAMAC_REGION_US915
  -D REGION_US915=1
  -D LORA_DISPLAY=0
  -D GPIO_PIN_COUNT=48
  -I "Main Code/Main-pIO/include"
  -I "Main Code/Main-pIO/include/receiver"
  -I "Main Code/Main-pIO/include/web"
lib_ldf_mode = deep
lib_deps =
  madhephaestus/ESP32Servo
  bblanchon/ArduinoJson@7.4.2
  beegee-tokyo/DHT sensor library for ESPx@^1.19
  heltecautomation/Heltec ESP32 Dev-Boards@2.1.5
  WiFi
  WebServer
  HTTPClient

[env:lora_transmitter]
platform = espressif32@6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<Main Code/Main-pIO/src/transmitter/**>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D HELTEC_BOARD=30
  -D SLOW_CLK_TPYE=0
  -D LoRaWAN_DEBUG_LEVEL=0
  -D WIFI_LORA_32_V3=1
  -D RADIO_CHIP_SX1262=1
  -D ACTIVE_REGION=LORAMAC_REGION_US915
  -D REGION_US915=1
  -D LORA_DISPLAY=0
  -D GPIO_PIN_COUNT=48
  -I "Main Code/Main-pIO/include"
  -I "Main Code/Main-pIO/include/transmitter"
lib_ldf_mode = deep
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx@^1.19
  heltecautomation/Heltec ESP32 Dev-Boards@2.1.5

[env:camera]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_src_filter =
  -<*>
  +<Camera Code/Camera-pIO/src/**>
  +<Camera Code/Camera-pIO/tflite-model/**>
  +<Camera Code/Camera-pIO/edge-impulse-sdk/classifier/**>
  +<Camera Code/Camera-pIO/edge-impulse-sdk/dsp/**>
  +<Camera Code/Camera-pIO/edge-impulse-sdk/porting/espressif/**>
  +<Camera Code/Camera-pIO/edge-impulse-sdk/tensorflow/**>
  +<Camera Code/Camera-pIO/edge-impulse-sdk/third_party/**>
  +<Camera Code/Camera-pIO/edge-impulse-sdk/CMSIS/DSP/Source/**>
  +<Camera Code/Camera-pIO/edge-impulse-sdk/CMSIS/NN/Source/**>
build_flags =
  -D BOARD_HAS_PSRAM
  -D CAMERA_MODEL_XIAO_ESP32S3
  -D EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1
  -D EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN_S3=1
  -D CONFIG_IDF_TARGET_ESP32S3=1
  -D EIDSP_QUANTIZE_FILTERBANK=0
  -D EIDSP_USE_CMSIS_DSP=0
  -D EI_CLASSIFIER_USE_FULL_TFLITE=0
  -D ARDUINOSTL_M_H
  -D TF_LITE_DISABLE_X86_NEON=1
  -D NDEBUG
  -fno-exceptions
  -Wa,-I,"Camera Code/Camera-pIO"
  -I "Camera Code/Camera-pIO/include"
  -I "Camera Code/Camera-pIO"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/third_party"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/third_party/flatbuffers/include"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/third_party/gemmlowp"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/third_party/ruy"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/CMSIS/Core/Include"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/CMSIS/DSP/Include"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/CMSIS/NN/Include"
  -I "Camera Code/Camera-pIO/edge-impulse-sdk/porting/espressif/ESP-NN/include"
  -I "Camera Code/Camera-pIO/tflite-model"
  -I "Camera Code/Camera-pIO/model-parameters"
